[[plugins]]
repo = 'haya14busa/vim-edgemotion'
on_map = '<Plug>(edgemotion-'
hook_add = '''
nnoremap <C-j> <Plug>(edgemotion-j)
nnoremap <C-k> <Plug>(edgemotion-k)
vnoremap <C-j> <Plug>(edgemotion-j)
vnoremap <C-k> <Plug>(edgemotion-k)
'''

[[plugins]]
repo = 'cohama/lexima.vim'
on_event = 'InsertEnter'

[[plugins]]
repo = 'machakann/vim-sandwich'
on_event = 'VimEnter'
hook_source = 'runtime macros/sandwich/keymap/surround.vim'

[[plugins]]
repo = 'rhysd/clever-f.vim'
on_map = ['f', 'F', 't', 'T']
hook_add = '''
let g:clever_f_smart_case = 1
'''

[[plugins]]
repo = 'kana/vim-operator-replace'
depends = 'vim-operator-user'
on_map = '<Plug>(operator-replace)'
hook_add = '''
map _ <Plug>(operator-replace)
'''

[[plugins]]
repo = 'lambdalisue/vim-gin'
on_cmd = 'Gin'

[[plugins]]
repo = 'tani/dmacro.nvim'
on_map = '<Plug>(dmacro-play-macro)'
hook_add = '''
inoremap <F1> <Plug>(dmacro-play-macro)
nnoremap <F1> <Plug>(dmacro-play-macro)
'''
