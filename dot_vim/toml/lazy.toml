[[plugins]]
repo = 'haya14busa/vim-edgemotion'
on_map = '<Plug>(edgemotion-'
hook_add = '''
nnoremap <C-j> <Plug>(edgemotion-j)
nnoremap <C-k> <Plug>(edgemotion-k)
vnoremap <C-j> <Plug>(edgemotion-j)
vnoremap <C-k> <Plug>(edgemotion-k)
'''

[[plugins]]
repo = 'cohama/lexima.vim'
on_event = 'InsertEnter'

[[plugins]]
repo = 'machakann/vim-sandwich'
on_event = 'VimEnter'
hook_source = 'runtime macros/sandwich/keymap/surround.vim'

[[plugins]]
repo = 'rhysd/clever-f.vim'
on_map = '<Plug>(clever-f-'

[[plugins]]
repo = 'https://github.com/kana/vim-textobj-user'
on_source = 'VimEnter'

[[plugins]]
repo = 'kana/vim-operator-replace'
on_source = 'vim-textobj-user'

[[plugins]]
repo = 'mattn/vim-molder'
on_event = 'VimEnter'

[[plugins]]
repo = 'mattn/vim-molder-oil'
on_source = 'vim-molder'
