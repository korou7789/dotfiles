[[plugins]]
repo = 'vim-jp/vimdoc-ja'
on_event = ['CmdlineEnter', 'CursorHold']
hook_add = 'set helplang=ja,en'

[[plugins]]
repo = 'max397574/better-escape.nvim'
on_event = ['InsertEnter']
lua_source = '''
require("better_escape").setup()
'''

[[plugins]]
repo = 'windwp/nvim-autopairs'
on_event = ['InsertEnter']
lua_source = '''
require("nvim-autopairs").setup()
'''

[[plugins]]
repo = 'dstein64/vim-startuptime'
on_cmd = 'StartupTime'

[[plugins]]
repo = 'b0o/incline.nvim'
on_event = ['CursorHold', 'InsertLeave']
lua_source = '''
require("incline").setup()
'''

[[plugins]]
repo = 'mvllow/modes.nvim'
on_event = ['CursorHold', 'InsertEnter']
hooks_file = '$HOOKS_DIR/modes.lua'

[[plugins]]
repo = 'kevinhwang91/nvim-hlslens'
on_event = ['BufRead', 'BufNewFile']
hooks_file = '$HOOKS_DIR/hlslens.lua'

[[plugins]]
repo = 'kylechui/nvim-surround'
on_event = ['BufRead', 'BufNewFile']
lua_source = '''
require("nvim-surround").setup()
'''

[[plugins]]
repo = 'monaqa/dial.nvim'
on_event = ['BufRead', 'BufNewFile']
hooks_file = '$HOOKS_DIR/dial.lua'

[[plugins]]
repo = 'nacro90/numb.nvim'
on_event = ['CmdlineEnter']
lua_source = '''
require("numb").setup()
'''

[[plugins]]
repo = 'ysmb-wtsg/in-and-out.nvim'
on_map = { i = ['<C-CR>'] }
lua_source = '''
vim.keymap.set("i", "<C-CR>", function() require("in-and-out").in_and_out() end)
'''

[[plugins]]
repo = 'lewis6991/gitsigns.nvim'
on_event = ['BufRead', 'BufNewFile']
lua_source = '''
require("gitsigns").setup()
'''

[[plugins]]
repo = 'tani/dmacro.vim'
on_map = '<Plug>(dmacro-play-macro)'
lua_add = '''
vim.keymap.set({ "i", "n" }, '<F5>', '<Plug>(dmacro-play-macro)')
'''

[[plugins]]
repo = 'lambdalisue/vim-gin'
depends = 'denops.vim'
on_cmd = ['Gin']

[[plugins]]
repo = 'tyamaz/jumpcursor.vim'
on_map = '<Plug>(jumpcursor-jump)'
lua_add = '''
vim.keymap.set("n", "<space><space>", "<Plug>(jumpcursor-jump)", {noremap = true, silent = true})
'''

[[plugins]]
repo = 'haya14busa/vim-edgemotion'
on_map = ['<Plug>(edgemotion-']
lua_add = '''
vim.keymap.set({ "n", "v" }, "<C-j>", "<Plug>(edgemotion-j)")
vim.keymap.set({ "n", "v" }, "<C-k>", "<Plug>(edgemotion-k)")
'''

[[plugins]]
repo = 'lambdalisue/vim-mr'

[[plugins]]
repo = 'shellRaining/hlchunk.nvim'
on_event = ['BufRead', 'BufNewFile']
hooks_file = '$HOOKS_DIR/hlchunk.lua'

[[plugins]]
repo = 'folke/noice.nvim'
on_event = ['BufRead', 'BufNewFile', 'CmdlineEnter', 'InsertEnter']
depends = [ 'nui.nvim', 'nvim-treesitter' ]
hooks_file = '$HOOKS_DIR/noice.lua'

[[plugins]]
repo = 'MunifTanjim/nui.nvim'

[[plugins]]
repo = 'glacambre/firenvim'
on_event = 'CursorHold'

[[plugins]]
repo = 'thinca/vim-qfreplace'
on_event = 'CmdlineEnter'
