[[plugins]]
repo = 'Shougo/ddc.vim'
on_event = ['InsertEnter', 'CmdlineEnter']
depends = ['denops.vim', 'pum.vim', 'denippet.vim']
hooks_file = '$HOOKS_DIR/ddc.lua'

[[plugins]]
repo = 'Shougo/pum.vim'
on_event = 'InsertEnter'

[[plugins]]
repo = 'Shougo/ddc-ui-pum'
depends = 'pum.vim'
on_source = 'ddc.vim'

[[plugins]]
repo = 'vim-skk/skkeleton'
depends = ['denops.vim', 'ddc.vim']
on_map = { ict = '<Plug>(skkeleton-toggle)'}
hooks_file = '$HOOKS_DIR/skkeleton.lua'

[[plugins]]
repo = 'delphinus/skkeleton_indicator.nvim'
lua_source = '''
require("skkeleton_indicator").setup()
'''
on_source = 'skkeleton'


[[plugins]]
repo = 'uga-rosa/denippet.vim'
on_source = ['ddc.vim']
lua_post_source = '''
for _, snip in ipairs(vim.fn.globpath(vim.fs.joinpath(vim.fn['dpp#get']('friendly-snippets').path, 'snippets'), '**/*.json', true, true)) do
  vim.fn['denippet#load'](snip)
end
'''

[[plugins]]
repo = 'rafamadriz/friendly-snippets'
on_source = ['denippet.vim']


[[plugins]]
repo = 'Shougo/ddc-source-around'
on_source = 'ddc.vim'

[[plugins]]
repo = 'LumaKernel/ddc-source-file'
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-source-lsp'
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-buffer'
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-source-rg'
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-source-cmdline'
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-source-cmdline_history'
on_source = 'ddc.vim'


[[plugins]]
repo = 'Shougo/ddc-filter-matcher_head'
on_source = 'ddc.vim'

[[plugins]]
repo = 'tani/ddc-fuzzy'
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-filter-sorter_rank'
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-filter-converter_remove_overlap'
on_source = 'ddc.vim'
