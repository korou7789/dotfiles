[main]
font=M PLUS 1 Code:pixelsize=24
dpi-aware=no
prompt=""
placeholder=アプリを検索
icons-enabled=yes
icon-theme=Adwaita
image-size-ratio=1
lines=5
width=52
horizontal-pad=32
vertical-pad=24
inner-pad=16
# Bare line-height values are points; use pixels to keep icons proportional.
line-height=36px
match-mode=fzf
terminal=foot -e

[colors]
background=252428ff
text=f2f0f8ff
prompt=b6aad9ff
placeholder=b6aad9ff
input=f2f0f8ff
match=b89cffff
selection=5f5a6fff
selection-text=f2f0f8ff
selection-match=b89cffff
border=39383fff

[border]
width=1
radius=0
